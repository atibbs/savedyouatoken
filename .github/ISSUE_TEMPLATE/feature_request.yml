name: Feature request
description: Propose a bounded improvement to a Community surface
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or workflow gap should this solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without prescribing an implementation.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Analysis engine
        - CLI
        - Runtime SDK
        - Web analyser
        - Agent kit
        - Contracts or documentation
        - Cross-surface
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundary
    attributes:
      label: Community boundary
      options:
        - label: The request can deliver local value without private Monitor infrastructure.
          required: true
