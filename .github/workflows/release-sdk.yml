name: Release SDK

# Publication is coupled to a protected release tag (`sdk-v*`), not to every push to main that
# touches the SDK — task 4.3 of publish-community-source. tag-releases.yml creates that tag the
# moment a version bump merges to main and dispatches this workflow automatically; a maintainer
# can also push an `sdk-v*` tag by hand as an independent path. Either way, if the tagged
# version is new and higher than what is on npm, the exact code at that tag is verified and
# published — no untagged commit is ever published, and npm provenance attributes the release
# to the tag, not to main's tip.
#
# Unlike the CLI (invoked live via `npx ...@latest`, so it must never be stale), the SDK is a
# pinned dependency, so releases are driven only by a deliberate `packages/sdk` version bump —
# there is no staleness guard forcing a bump when the bundled pricing catalogue changes. See
# packages/sdk/RELEASING.md.
#
# The exact tarball is type-checked from a clean NodeNext consumer (skipLibCheck off) BEFORE it
# is published, and published in a single step directly to `latest` via OIDC trusted publishing
# (no stored token). A build that fails verification is never published, so `latest` is never
# broken. The gate is idempotent (an already-published version is skipped) and monotonic (the
# version must be semver-greater than the current `latest`).

on:
  push:
    tags: ['sdk-v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag to release (e.g. sdk-v0.2.1)'
        required: true
        type: string

concurrency: release-sdk

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — npm trusted publishing + automatic provenance, no stored token
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) needs a recent npm.
      - run: npm install -g npm@latest
      - run: npm ci

      - name: Release gate (idempotent + monotonic)
        id: gate
        run: node scripts/release-gate.mjs @savedyouatoken/sdk packages/sdk

      - name: Build
        if: steps.gate.outputs.release == 'true'
        run: npm run build:sdk

      # Pack once. Verification and publish then use the SAME tarball, so the bytes published
      # are exactly the bytes verified — not a second rebuild.
      - name: Pack
        id: pack
        if: steps.gate.outputs.release == 'true'
        run: |
          TARBALL=$(npm pack --workspace @savedyouatoken/sdk --pack-destination "$RUNNER_TEMP" --silent | tail -1)
          echo "tarball=$RUNNER_TEMP/$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Verify the packed tarball (clean NodeNext consumer, skipLibCheck off)
        if: steps.gate.outputs.release == 'true'
        run: node packages/sdk/scripts/verify-packed-types.mjs "${{ steps.pack.outputs.tarball }}"

      # Publish that exact tarball, straight to `latest`, authenticated via OIDC.
      - name: Diagnostic - OIDC claims npm will see (token itself is never printed)
        if: steps.gate.outputs.release == 'true'
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          node -e "const c=JSON.parse(Buffer.from(process.argv[1].split('.')[1],'base64url').toString());const k=['aud','iss','repository','repository_owner','repository_id','workflow','workflow_ref','job_workflow_ref','ref','event_name','environment','runner_environment'];console.log(JSON.stringify(Object.fromEntries(k.map(x=>[x,c[x]])),null,1))" "$TOKEN"
          npm --version

      - name: Publish the verified tarball
        if: steps.gate.outputs.release == 'true'
        run: npm publish "${{ steps.pack.outputs.tarball }}" --provenance --access public --loglevel verbose
