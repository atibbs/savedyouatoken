name: Release CLI

# Publication is coupled to the merge: on every push to main, if the CLI's version is ahead
# of what is on npm, it is published. A merged version bump (which the CI staleness guard
# forces whenever the pricing catalogue changes) therefore ships automatically — no manual
# tag. The build is published to a candidate dist-tag first, verified from the registry, and
# only then promoted to `latest`, so a broken build never becomes the default install.

on:
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/core/**'

concurrency: release-cli

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — npm trusted publishing + automatic provenance, no stored token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) needs a recent npm.
      - run: npm install -g npm@latest
      - run: npm ci

      - name: Decide whether to release
        id: gate
        run: |
          LOCAL=$(node -p "require('./packages/cli/package.json').version")
          REMOTE=$(npm view savedyouatoken version 2>/dev/null || echo none)
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "CLI $LOCAL already on npm — nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Releasing CLI $LOCAL (npm has: $REMOTE)."
          fi

      - name: Build
        if: steps.gate.outputs.release == 'true'
        run: npm run build:cli

      # Publish to a candidate tag, never straight to latest. Auth is via OIDC trusted
      # publishing (configured for this repo on npmjs.com); no NODE_AUTH_TOKEN is set.
      - name: Publish candidate
        if: steps.gate.outputs.release == 'true'
        run: npm publish --workspace savedyouatoken --tag rc --provenance --access public

      - name: Verify the published candidate from the registry
        if: steps.gate.outputs.release == 'true'
        run: |
          V="${{ steps.gate.outputs.version }}"
          DIR=$(mktemp -d); cd "$DIR"
          npm init -y >/dev/null
          npm install "savedyouatoken@$V" --no-audit --no-fund
          REPORTED=$(node node_modules/savedyouatoken/dist/index.js --version)
          echo "reported=$REPORTED expected=$V"
          test "$REPORTED" = "$V"

      # Only a verified candidate becomes the default install.
      - name: Promote candidate to latest
        if: steps.gate.outputs.release == 'true'
        run: npm dist-tag add "savedyouatoken@${{ steps.gate.outputs.version }}" latest
